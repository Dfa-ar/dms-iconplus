version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms-iconplus-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: iconplus_app
      DB_USERNAME: iconplus
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
    depends_on:
      - mysql
      - redis
    volumes:
      - .:/var/www/html
    command: >
      sh -c "/var/www/html/docker/entrypoint.sh"

  nginx:
    image: nginx:alpine
    container_name: dms-iconplus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.0
    container_name: dms-iconplus-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: iconplus_app
      MYSQL_USER: iconplus
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: dms-iconplus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql-data:
